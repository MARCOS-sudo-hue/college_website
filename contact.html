<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    h3{
      color: beige;
      font-size: 32px;
      text-align: center;
      text-decoration: underline;
    }
    form{
      background-color: peachpuff;
      padding: 15px;
      width:500px ;
      border-radius: 15px;
    }
    label{
      background-color: white;
      color: burlywood;
    }
    label:hover{
      background-color: gold;
      color: azure;
    }
    button{
      background-color:red;
      color: azure;
    }
    button:hover{
      background-color: green;
      color: green;
    }

  </style>
</head>
<body>
<h3>Contact Form</h3>
<form action="">
  <label>NAME</label>
  <input type="text"><br><br>

  <label>EMAIL:</label>
  <input type="email"><br><br>

  <label>DEPARTMENT</label>
  <select>
    <option>Science Depaartment</option>
        <option>English Depaartment</option>
    <option>Maths Depaartment</option>
        <option>Kiswahili Depaartment</option>
  </select><br><br>
  <label>COMMENT</label><br><br>
  <textarea  cols="30" rows="10"></textarea><br><br>
  <button>SUBMIT</button>
</form>
</body>
</html>
